name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'
  # Credentials of the ephemeral service container only — not secrets.
  DATABASE_URL: postgresql://kenzo:kenzo_ci@127.0.0.1:5432/kenzo_kore?schema=public
  DIRECT_DATABASE_URL: postgresql://kenzo:kenzo_ci@127.0.0.1:5432/kenzo_kore?schema=public
  TEST_DATABASE_URL: postgresql://kenzo:kenzo_ci@127.0.0.1:5432/kenzo_kore_test?schema=public
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate ephemeral CI secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  database:
    name: Migrations · integration & authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kenzo
          POSTGRES_PASSWORD: kenzo_ci
          POSTGRES_DB: kenzo_kore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kenzo -d kenzo_kore"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate ephemeral CI secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      # `npm ci` runs @prisma/client's postinstall from the repo root, where there is
      # no schema, so the client stays an uninitialised stub. Generate it explicitly;
      # the quality job gets this via `npm run typecheck`.
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Create test database
        run: PGPASSWORD=kenzo_ci psql -h 127.0.0.1 -U kenzo -d kenzo_kore -c "CREATE DATABASE kenzo_kore_test"
      - name: Validate migrations (up · drift · down · up)
        run: npm run db:validate-migrations
      - name: Apply migrations + reference data
        run: npm run db:migrate && npm run db:seed
      - name: Integration, API and authorization tests
        run: npm run test:integration

  security:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production dependency audit (fails on high/critical)
        run: npm run audit:deps
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
