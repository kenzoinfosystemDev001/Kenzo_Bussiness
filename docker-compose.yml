# Local development infrastructure. Synthetic data only (PRD §16.1).
#   docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    container_name: kenzo-kore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kenzo
      POSTGRES_PASSWORD: kenzo_local_dev_only
      POSTGRES_DB: kenzo_kore
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - kenzo_pg_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kenzo -d kenzo_kore']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kenzo_pg_data:
